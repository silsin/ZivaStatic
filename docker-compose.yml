version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: staticipvpn
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  backend:
    build: ./backend
    restart: always
    ports:
      - "3796:3796"
    command: uvicorn app.main:app --host 0.0.0.0 --port 3796 --reload
    env_file: .env
    depends_on:
      - postgres
      - redis

  celery_worker:
    build: ./backend
    restart: always
    command: celery -A app.tasks.provision_server.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis
      - backend

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "1475:1475"
    depends_on:
      - backend

volumes:
  postgres_data:
